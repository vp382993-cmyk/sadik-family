<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SADIK FAMILY — Общая казна</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1219;color:#edf2f7;font:15px Arial}header{padding:16px 22px;background:#141d28;border-bottom:1px solid #2a3645;display:flex;justify-content:space-between;align-items:center}h1{margin:0}.gold{color:#e4c15b}.wrap{max-width:1150px;margin:auto;padding:18px}.card{background:#161f2b;border:1px solid #2b3848;border-radius:14px;padding:18px}.login{max-width:410px;margin:12vh auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.big{font-size:28px;font-weight:bold;margin-top:8px}.ok{color:#70d6a0}.bad{color:#ff7777}.muted{color:#9eabb9}.hidden{display:none!important}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#222e3c;color:#fff;border:1px solid #3a495b;border-radius:9px;padding:10px 14px;cursor:pointer}input,select{background:#0f161f;color:#fff;border:1px solid #3a495b;border-radius:8px;padding:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:170px}section{display:none}.show{display:block}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:10px;border-bottom:1px solid #2b3848;text-align:left}.toast{position:fixed;right:18px;bottom:18px;background:#273547;padding:12px 16px;border-radius:10px;display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body>
<div id="loginPage" class="login card"><h1>SADIK <span class="gold">FAMILY</span></h1><p class="muted">Общая онлайн-казна • склад • админка</p><form id="loginForm"><div class="field"><label>Логин</label><input id="login" value="admin"></div><br><div class="field"><label>Пароль</label><input id="pass" type="password" value="admin123"></div><br><button style="width:100%">Войти</button></form></div>
<div id="app" class="hidden"><header><h1>SADIK <span class="gold">FAMILY</span></h1><div><span id="who"></span> <button id="out">Выйти</button></div></header><main class="wrap"><nav id="nav"></nav>
<section id="home" class="show"><div class="grid"><div class="card">Казна<div id="treasury" class="big gold">$0</div></div><div class="card">Доход за неделю<div id="weekly" class="big ok">$0</div></div><div class="card">Расходы<div id="expenses" class="big bad">$0</div></div><div class="card">Склад<div id="stock" class="big">$0</div></div></div><div class="card" style="margin-top:14px"><h2>Последние операции</h2><div id="recent"></div></div></section>
<section id="treasurySec"><div class="card"><h2>Казна</h2><div class="row"><div class="field"><label>Тип</label><select id="type"><option value="income">Приход</option><option value="expense">Расход</option></select></div><div class="field"><label>Сумма $</label><input id="amount" type="number" min="0.01" step="0.01"></div><div class="field"><label>Комментарий</label><input id="note"></div><div style="align-self:end"><button id="addOp">Добавить</button></div></div><hr><div class="row"><div class="field"><label>Базовая казна $</label><input id="base" type="number"></div><div class="field"><label>Доход недели $</label><input id="week" type="number"></div><div style="align-self:end"><button id="save">Сохранить</button></div></div></div></section>
<section id="warehouseSec"><div class="card"><h2>Склад</h2><div class="row"><div class="field"><label>Название</label><input id="iname"></div><div class="field"><label>Количество</label><input id="iqty" type="number" min="0.01" step="0.01"></div><div class="field"><label>Цена $</label><input id="iprice" type="number" min="0" step="0.01"></div><div style="align-self:end"><button id="addItem">Добавить</button></div></div><div id="wh"></div></div></section>
<section id="opsSec"><div class="card"><h2>История операций</h2><div id="ops"></div></div></section>
<section id="usersSec"><div class="card"><h2>Админка</h2><div class="row"><div class="field"><label>Логин</label><input id="un"></div><div class="field"><label>Пароль</label><input id="up" type="password"></div><div class="field"><label>Роль</label><select id="ur"><option value="member">Участник</option><option value="cashier">Кассир</option><option value="warehouse">Кладовщик</option><option value="admin">Администратор</option><option value="owner">Владелец</option></select></div><div style="align-self:end"><button id="addUser">Создать</button></div></div><div id="users"></div></div></section>
</main></div><div id="toast" class="toast"></div>
<script>
const E=id=>document.getElementById(id), roles={owner:'Владелец',admin:'Администратор',cashier:'Кассир',warehouse:'Кладовщик',member:'Участник'};let me=null;
const money=n=>'$'+Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}
function toast(t){E('toast').textContent=t;E('toast').style.display='block';setTimeout(()=>E('toast').style.display='none',2800)}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('show'));E(id).classList.add('show')}
function buildNav(){let p={owner:['users','treasury','warehouse','operations'],admin:['users','treasury','warehouse','operations'],cashier:['treasury','operations'],warehouse:['warehouse'],member:[]}[me.role]||[];let s='<button data-x="home">Главная</button>';if(p.includes('treasury'))s+='<button data-x="treasurySec">Казна</button>';if(p.includes('warehouse'))s+='<button data-x="warehouseSec">Склад</button>';if(p.includes('operations'))s+='<button data-x="opsSec">История</button>';if(p.includes('users'))s+='<button data-x="usersSec">Админка</button>';E('nav').innerHTML=s;E('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.x))}
function opsHtml(a,actions){if(!a.length)return '<p class="muted">Операций пока нет.</p>';return '<table class="table"><tr><th>Тип</th><th>Сумма</th><th>Комментарий</th><th>Кто</th>'+(actions?'<th></th>':'')+'</tr>'+a.map(o=>'<tr><td>'+(o.type==='income'?'<span class="ok">Приход</span>':'<span class="bad">Расход</span>')+'</td><td>'+money(o.amount)+'</td><td>'+esc(o.note)+'</td><td>'+esc(o.by)+'</td>'+(actions?'<td><button onclick="delOp('+o.id+')">Удалить</button></td>':'')+'</tr>').join('')+'</table>'}
function whHtml(a){if(!a.length)return '<p class="muted">Склад пуст.</p>';return '<table class="table"><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Итого</th><th></th></tr>'+a.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.qty*i.price)+'</td><td><button onclick="delItem('+i.id+')">Удалить</button></td></tr>').join('')+'</table>'}
function usersHtml(a){return '<table class="table"><tr><th>Логин</th><th>Роль</th><th>Статус</th><th>Действия</th></tr>'+a.map(u=>'<tr><td>'+esc(u.username)+'</td><td><select onchange="role('+u.id+',this.value)">'+Object.entries(roles).map(([k,v])=>'<option value="'+k+'" '+(u.role===k?'selected':'')+'>'+v+'</option>').join('')+'</select></td><td>'+(u.active?'<span class="ok">Активен</span>':'<span class="bad">Заблокирован</span>')+'</td><td><button onclick="toggle('+u.id+','+(!u.active)+')">'+(u.active?'Заблокировать':'Разблокировать')+'</button> <button onclick="pwd('+u.id+')">Пароль</button></td></tr>').join('')+'</table>'}
async function load(){let d=await api('/api/dashboard');E('treasury').textContent=money(d.treasury);E('weekly').textContent=money(d.weeklyIncome);E('expenses').textContent=money(d.expenses);E('stock').textContent=money(d.stockValue);E('recent').innerHTML=opsHtml(d.operations.slice(0,8),false);E('ops').innerHTML=opsHtml(d.operations,true);E('wh').innerHTML=whHtml(d.warehouse);if(me.role==='owner'||me.role==='admin'){let s=await api('/api/settings');E('base').value=s.treasury;E('week').value=s.weeklyIncome;E('users').innerHTML=usersHtml(await api('/api/users'))}}
E('loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:E('login').value,password:E('pass').value})});me=d.user;E('loginPage').classList.add('hidden');E('app').classList.remove('hidden');E('who').textContent=me.username+' · '+roles[me.role];buildNav();await load()}catch(e){toast(e.message)}};
E('out').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
E('addOp').onclick=async()=>{try{await api('/api/operations',{method:'POST',body:JSON.stringify({type:E('type').value,amount:E('amount').value,note:E('note').value})});E('amount').value='';E('note').value='';toast('Операция добавлена');await load()}catch(e){toast(e.message)}};
E('save').onclick=async()=>{try{await api('/api/settings',{method:'PUT',body:JSON.stringify({treasury:E('base').value,weeklyIncome:E('week').value})});toast('Сохранено');await load()}catch(e){toast(e.message)}};
E('addItem').onclick=async()=>{try{await api('/api/warehouse',{method:'POST',body:JSON.stringify({name:E('iname').value,qty:E('iqty').value,price:E('iprice').value})});E('iname').value='';E('iqty').value='';E('iprice').value='';toast('Товар добавлен');await load()}catch(e){toast(e.message)}};
E('addUser').onclick=async()=>{try{await api('/api/users',{method:'POST',body:JSON.stringify({username:E('un').value,password:E('up').value,role:E('ur').value})});E('un').value='';E('up').value='';toast('Пользователь создан');await load()}catch(e){toast(e.message)}};
async function delOp(id){try{await api('/api/operations/'+id,{method:'DELETE'});await load()}catch(e){toast(e.message)}}async function delItem(id){try{await api('/api/warehouse/'+id,{method:'DELETE'});await load()}catch(e){toast(e.message)}}async function role(id,r){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({role:r})});toast('Роль изменена')}catch(e){toast(e.message);await load()}}async function toggle(id,a){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:a})});await load()}catch(e){toast(e.message)}}async function pwd(id){let p=prompt('Новый пароль:');if(!p)return;try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});toast('Пароль изменён')}catch(e){toast(e.message)}}
(async()=>{try{let d=await api('/api/me');me=d.user;E('loginPage').classList.add('hidden');E('app').classList.remove('hidden');E('who').textContent=me.username+' · '+roles[me.role];buildNav();await load()}catch(e){}})();
</script></body></html>
